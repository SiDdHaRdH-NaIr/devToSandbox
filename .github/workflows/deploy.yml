name: Salesforce Delta Deployment Pipeline

on:
  pull_request:
    branches:
      - main
      - uat
  push:
    branches:
      - main
      - uat

jobs:

  #############################################
  # PR VALIDATION (Delta + Check-only)
  #############################################
  validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI (sfdx)
        run: |
          wget https://developer.salesforce.com/media/salesforce-cli/sfdx/channels/stable/sfdx-linux-x64.tar.xz
          mkdir -p ~/sfdx
          tar xJf sfdx-linux-x64.tar.xz -C ~/sfdx --strip-components 1
          echo "$HOME/sfdx/bin" >> $GITHUB_PATH
          sfdx --version

      - name: Install sfdx-git-delta
        run: |
          echo y | sfdx plugins:install sfdx-git-delta || true
          sfdx plugins

      - name: Select validation target
        id: select-target
        run: |
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "target=QA" >> $GITHUB_OUTPUT
          else
            echo "target=UAT" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to target org
        env:
          QA_URL: ${{ secrets.SFDX_AUTH_URL }}
          UAT_URL: ${{ secrets.SFDX_AUTH_URL_UAT }}
        run: |
          if [[ "${{ steps.select-target.outputs.target }}" == "QA" ]]; then
            echo "$QA_URL" > sfdx_auth.txt
            sfdx auth:sfdxurl:store -f sfdx_auth.txt -a QA -s
          else
            echo "$UAT_URL" > sfdx_auth.txt
            sfdx auth:sfdxurl:store -f sfdx_auth.txt -a UAT -s
          fi

      - name: Generate Delta (PR)
        run: |
          mkdir -p changed-sources
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          sfdx sgd:source:delta --to "$HEAD" --from "$BASE" --output changed-sources/ --generate-delta --source force-app/

      - name: Validate Delta Deployment
        run: |
          if [ -d "changed-sources/force-app" ]; then
            sfdx force:source:deploy \
              -p "changed-sources/force-app" \
              --checkonly \
              --ignoreconflicts \
              --testlevel RunLocalTests \
              -u ${{ steps.select-target.outputs.target }}
          else
            echo "No delta to validate."
          fi

  #############################################
  # DEPLOY TO QA (when main branch is pushed)
  #############################################
  deploy_qa:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: |
          wget https://developer.salesforce.com/media/salesforce-cli/sfdx/channels/stable/sfdx-linux-x64.tar.xz
          mkdir -p ~/sfdx
          tar xJf sfdx-linux-x64.tar.xz -C ~/sfdx --strip-components 1
          echo "$HOME/sfdx/bin" >> $GITHUB_PATH
          sfdx --version

      - name: Install sfdx-git-delta
        run: |
          echo y | sfdx plugins:install sfdx-git-delta || true
          sfdx plugins

      - name: Authenticate to QA
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          echo "$SFDX_AUTH_URL" > sfdx_auth.txt
          sfdx auth:sfdxurl:store -f sfdx_auth.txt -a QA -s

      - name: Generate delta for main push
        run: |
          mkdir -p changed-sources
          sfdx sgd:source:delta --to "HEAD" --from "HEAD^" --output changed-sources/ --generate-delta --source force-app/

      - name: Deploy delta to QA
        run: |
          if [ -d "changed-sources/force-app" ]; then
            sfdx force:source:deploy \
              -p "changed-sources/force-app" \
              --ignoreconflicts \
              --testlevel RunLocalTests \
              -u QA
          else
            echo "No delta to deploy to QA."
          fi

  #############################################
  # DEPLOY TO UAT (when uat branch is pushed)
  #############################################
  deploy_uat:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: |
          wget https://developer.salesforce.com/media/salesforce-cli/sfdx/channels/stable/sfdx-linux-x64.tar.xz
          mkdir -p ~/sfdx
          tar xJf sfdx-linux-x64.tar.xz -C ~/sfdx --strip-components 1
          echo "$HOME/sfdx/bin" >> $GITHUB_PATH
          sfdx --version

      - name: Install sfdx-git-delta
        run: |
          echo y | sfdx plugins:install sfdx-git-delta || true
          sfdx plugins

      - name: Authenticate to UAT
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL_UAT }}
        run: |
          echo "$SFDX_AUTH_URL" > sfdx_auth.txt
          sfdx auth:sfdxurl:store -f sfdx_auth.txt -a UAT -s

      - name: Generate delta for uat push
        run: |
          mkdir -p changed-sources
          sfdx sgd:source:delta --to "HEAD" --from "HEAD^" --output changed-sources/ --generate-delta --source force-app/

      - name: Deploy delta to UAT
        run: |
          if [ -d "changed-sources/force-app" ]; then
            sfdx force:source:deploy \
              -p "changed-sources/force-app" \
              --ignoreconflicts \
              --testlevel RunLocalTests \
              -u UAT
          else
            echo "No delta to deploy to UAT."
          fi
