name: Salesforce Delta Deployment Pipeline

on:
  pull_request:
    branches: [ main, uat ]
  push:
    branches: [ main, uat ]

jobs:

  #############################################
  # PR VALIDATION (Delta + Check-only)
  #############################################
  validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI (sf)
        run: |
          npm install --global @salesforce/cli
          sf --version

      - name: Install sfdx-git-delta plugin
        run: |
          echo y | sf plugins install sfdx-git-delta || true
          sf plugins

      - name: Select Validation Target
        id: select-target
        run: |
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "target=QA" >> $GITHUB_OUTPUT
          else
            echo "target=UAT" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Target Org
        env:
          QA_URL: ${{ secrets.SFDX_AUTH_URL }}
          UAT_URL: ${{ secrets.SFDX_AUTH_URL_UAT }}
        run: |
          if [[ "${{ steps.select-target.outputs.target }}" == "QA" ]]; then
            echo "$QA_URL" > auth.txt
            sf org login sfdx-url -f auth.txt -a QA
          else
            echo "$UAT_URL" > auth.txt
            sf org login sfdx-url -f auth.txt -a UAT
          fi

      - name: Generate Delta (PR)
        run: |
          mkdir -p changed-sources
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          sf sgd:source:delta \
            --to "$HEAD" \
            --from "$BASE" \
            --output changed-sources/ \
            --generate-delta \
            --source force-app/

      - name: Validate Delta Deployment
        run: |
          if [ -d "changed-sources/force-app" ]; then
            sf project deploy start \
              --source-dir changed-sources/force-app \
              --manifest changed-sources/package.xml \
              --dry-run \
              --ignore-conflicts \
              --test-level RunLocalTests \
              --wait 30 \
              -o ${{ steps.select-target.outputs.target }}
          else
            echo "No delta metadata changed — skipping validation."
          fi



  #############################################
  # DEPLOY TO QA (main branch push)
  #############################################
  deploy_qa:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install SF CLI
        run: |
          npm install --global @salesforce/cli
          sf --version

      - name: Install sfdx-git-delta
        run: |
          echo y | sf plugins install sfdx-git-delta || true

      - name: Authenticate to QA
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          echo "$SFDX_AUTH_URL" > auth.txt
          sf org login sfdx-url -f auth.txt -a QA

      - name: Generate Delta for main
        run: |
          mkdir -p changed-sources
          sf sgd:source:delta \
              --to "HEAD" \
              --from "HEAD^" \
              --output changed-sources/ \
              --generate-delta \
              --source force-app/

      - name: Deploy Delta to QA
        run: |
          if [ -d "changed-sources/force-app" ]; then
            sf project deploy start \
              --source-dir changed-sources/force-app \
              --manifest changed-sources/package.xml \
              --ignore-conflicts \
              --test-level RunLocalTests \
              -o QA
          else
            echo "No delta found — nothing to deploy to QA."
          fi



  #############################################
  # DEPLOY TO UAT (uat branch push)
  #############################################
  deploy_uat:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install SF CLI
        run: |
          npm install --global @salesforce/cli
          sf --version

      - name: Install sfdx-git-delta
        run: |
          echo y | sf plugins install sfdx-git-delta || true

      - name: Authenticate to UAT
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL_UAT }}
        run: |
          echo "$SFDX_AUTH_URL" > auth.txt
          sf org login sfdx-url -f auth.txt -a UAT

      - name: Generate Delta for UAT
        run: |
          mkdir -p changed-sources
          sf sgd:source:delta \
              --to "HEAD" \
              --from "HEAD^" \
              --output changed-sources/ \
              --generate-delta \
              --source force-app/

      - name: Deploy Delta to UAT
        run: |
          if [ -d "changed-sources/force-app" ]; then
            sf project deploy start \
              --source-dir changed-sources/force-app \
              --manifest changed-sources/package.xml \
              --ignore-conflicts \
              --test-level RunLocalTests \
              -o UAT
          else
            echo "No delta found — nothing to deploy to UAT."
          fi
