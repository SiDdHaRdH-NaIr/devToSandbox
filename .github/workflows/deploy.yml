name: Salesforce Deployment Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate:
    name: Validate Deployment on PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Salesforce CLI (sf)
        run: |
          npm install --global @salesforce/cli
          sf --version

      - name: Authenticate to Salesforce using Auth URL
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          echo "$SFDX_AUTH_URL" > sfdx_auth.txt
          sf org login sfdx-url -f sfdx_auth.txt -a DEPLOY_ORG
          sf org display -o DEPLOY_ORG

      - name: Validate Deploy (checkonly with selected tests)
        run: |
          sf project deploy start \
            --manifest manifest/package.xml \
            --checkonly \
            --force-overwrite \
            --test-level RunSpecifiedTests \
            --tests MySimpleClass_Test,CalculatorUtil_Test,OpportunityFetchDetails_Test,OpportunityRelatedAccounts_Test \
            --wait 30 \
            -o DEPLOY_ORG


  deploy:
    name: Deploy to Salesforce on Merge to Main
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Salesforce CLI (sf)
        run: |
          npm install --global @salesforce/cli
          sf --version

      - name: Authenticate to Salesforce using Auth URL
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          echo "$SFDX_AUTH_URL" > sfdx_auth.txt
          sf org login sfdx-url -f sfdx_auth.txt -a DEPLOY_ORG
          sf org display -o DEPLOY_ORG

      - name: Deploy Source to Sandbox
        run: |
          sf project deploy start \
            --manifest manifest/package.xml \
            --force-overwrite \
            --test-level RunSpecifiedTests \
            --tests MySimpleClass_Test,CalculatorUtil_Test,OpportunityFetchDetails_Test,OpportunityRelatedAccounts_Test \
            --wait 30 \
            -o DEPLOY_ORG
