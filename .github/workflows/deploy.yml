name: Salesforce Delta Deployment Pipeline

on:
  pull_request:
    branches:
      - main
      - uat
  push:
    branches:
      - main
      - uat

jobs:

  validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install sfdx (CLI)
        run: |
          wget https://developer.salesforce.com/media/salesforce-cli/sfdx/channels/stable/sfdx-linux-x64.tar.xz
          mkdir -p ~/sfdx
          tar xJf sfdx-linux-x64.tar.xz -C ~/sfdx --strip-components 1
          echo "$HOME/sfdx/bin" >> $GITHUB_PATH
          sf version

      - name: Install sfdx-git-delta plugin
        run: |
          echo y | sf plugins install sfdx-git-delta || true
          sf plugins

      - name: Select validation target
        id: select-target
        run: |
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "target=QA" >> $GITHUB_OUTPUT
          else
            echo "target=UAT" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to target org
        env:
          QA_URL: ${{ secrets.SFDX_AUTH_URL }}
          UAT_URL: ${{ secrets.SFDX_AUTH_URL_UAT }}
        run: |
          if [[ "${{ steps.select-target.outputs.target }}" == "QA" ]]; then
            echo "$QA_URL" > sfdx_auth.txt
            sf org login sfdx-url -f sfdx_auth.txt -a QA
          else
            echo "$UAT_URL" > sfdx_auth.txt
            sf org login sfdx-url -f sfdx_auth.txt -a UAT
          fi

      - name: Create delta (PR validation)
        run: |
          mkdir changed-sources || true
          # compare the PR head to the target branch reference to capture all PR changes
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          sf sgd:source:delta --to "$HEAD" --from "$BASE" --output changed-sources/ --generate-delta --source force-app/

      - name: Validate delta deploy (check-only)
        run: |
          if [ -d "changed-sources/force-app" ]; then
            sf project deploy start \
              --source-dir changed-sources/force-app \
              --manifest changed-sources/package.xml \
              --dry-run \
              --ignore-conflicts \
              --test-level RunLocalTests \
              --wait 30 \
              -o ${{ steps.select-target.outputs.target }}
          else
            echo "No changes detected by delta; skipping validation."
          fi

  deploy_qa:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install sfdx
        run: |
          wget https://developer.salesforce.com/media/salesforce-cli/sfdx/channels/stable/sfdx-linux-x64.tar.xz
          mkdir -p ~/sfdx
          tar xJf sfdx-linux-x64.tar.xz -C ~/sfdx --strip-components 1
          echo "$HOME/sfdx/bin" >> $GITHUB_PATH
          sf version

      - name: Install sfdx-git-delta
        run: |
          echo y | sf plugins install sfdx-git-delta || true
          sf plugins

      - name: Authenticate to QA
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          echo "$SFDX_AUTH_URL" > sfdx_auth.txt
          sf org login sfdx-url -f sfdx_auth.txt -a QA

      - name: Create delta for push (main)
        run: |
          mkdir changed-sources || true
          # create delta between previous commit on main and HEAD (merge commit)
          sf sgd:source:delta --to "HEAD" --from "HEAD^" --output changed-sources/ --generate-delta --source force-app/

      - name: Deploy delta to QA
        run: |
          if [ -d "changed-sources/force-app" ]; then
            sf project deploy start \
              --source-dir changed-sources/force-app \
              --manifest changed-sources/package.xml \
              --ignore-conflicts \
              --test-level RunLocalTests \
              --wait 30 \
              -o QA
          else
            echo "No delta to deploy to QA."
          fi

  deploy_uat:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install sfdx
        run: |
          wget https://developer.salesforce.com/media/salesforce-cli/sfdx/channels/stable/sfdx-linux-x64.tar.xz
          mkdir -p ~/sfdx
          tar xJf sfdx-linux-x64.tar.xz -C ~/sfdx --strip-components 1
          echo "$HOME/sfdx/bin" >> $GITHUB_PATH
          sf version

      - name: Install sfdx-git-delta
        run: |
          echo y | sf plugins install sfdx-git-delta || true
          sf plugins

      - name: Authenticate to UAT
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL_UAT }}
        run: |
          echo "$SFDX_AUTH_URL" > sfdx_auth.txt
          sf org login sfdx-url -f sfdx_auth.txt -a UAT

      - name: Create delta for push (uat)
        run: |
          mkdir changed-sources || true
          sf sgd:source:delta --to "HEAD" --from "HEAD^" --output changed-sources/ --generate-delta --source force-app/

      - name: Deploy delta to UAT
        run: |
          if [ -d "changed-sources/force-app" ]; then
            sf project deploy start \
              --source-dir changed-sources/force-app \
              --manifest changed-sources/package.xml \
              --ignore-conflicts \
              --test-level RunLocalTests \
              --wait 30 \
              -o UAT
          else
            echo "No delta to deploy to UAT."
          fi
